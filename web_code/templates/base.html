<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHGNet Calculator · 晶格计算台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=static_version) }}">
</head>
<body>
    <header class="topbar">
        <img
            class="topbar-banner"
            src="/logo/chgnet_ai_calculator_banner.png"
            alt="基于人工智能的大模型计算链：CHGNet + AI Model · Materials Workflow"
        >
    </header>

    <main class="app-shell">
        {% block content %}{% endblock %}
    </main>

    <script>
        window.APP_DEFAULTS = {{ defaults | tojson | safe }};
    </script>
    <script src="{{ url_for('static', filename='js/main.js', v=static_version) }}"></script>
</body>
</html>
